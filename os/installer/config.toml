# Rendered at CD time with DADIOS_LUKS_PASSPHRASE. Do not put a real passphrase here.
# Placeholder __LUKS_PASSPHRASE__ is substituted in .github/workflows/cd.yml.

[customizations.installer.kickstart]
contents = """
text --non-interactive
lang en_US.UTF-8
keyboard us
timezone America/New_York
network --bootproto=dhcp --device=link --activate --onboot=on
rootpw --lock
user --name=setup --password=$6$lECKZK9wyBsU1xGD$KtwcHJppZQYaQ.kna8f2g27QmJ.KmoAlaiZvAbsFC/GwWzApQSgThlxEHy56LSNL2pbQCHHqxsf9yMk8yNWVU. --iscrypted
%pre
disk=$(lsblk -dn -o NAME,TYPE,RM | awk '$2=="disk" && $3=="0" {print $1; exit}')
echo "ignoredisk --only-use=$disk" > /tmp/disk-include.ks
%end
%include /tmp/disk-include.ks
zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --noswap --type=lvm --encrypted --passphrase=__LUKS_PASSPHRASE__
%post --erroronfail --interpreter=/bin/bash
set -euo pipefail
mkdir -p /var/lib/dadi
printf '%s' '__LUKS_PASSPHRASE__' > /var/lib/dadi/luks-enroll.key
chmod 400 /var/lib/dadi/luks-enroll.key
/usr/libexec/dadi/tpm-enroll.sh --keep-key || true
%end
reboot
"""
