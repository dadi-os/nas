# Production Headscale. Clients dial the Cloudflare tunnel hostname.
server_url: https://dadi.ardusa.dev
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: true
  update_frequency: 24h

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

dns:
  magic_dns: true
  base_domain: dadi
  override_local_dns: false
  nameservers:
    global:
      - 1.1.1.1
  # Assumes host tailscaled (hostname os) is the first node and receives
  # 100.64.0.1. Extra records point service names at the box; host Caddy
  # on :80 routes by Host header.
  extra_records:
    - name: "yaad.dadi"
      type: "A"
      value: "100.64.0.1"
    - name: "dimaag.dadi"
      type: "A"
      value: "100.64.0.1"
    - name: "nas.dadi"
      type: "A"
      value: "100.64.0.1"
    - name: "dwar.dadi"
      type: "A"
      value: "100.64.0.1"

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

log:
  format: text
  level: info

policy:
  mode: file
  path: ""
