# dadiOS file share: the dadi home over SMB3 to Preferences users, on the mesh only.
# nftables keeps 445 closed on the LAN; hosts allow repeats that at the SMB layer.

[global]
	workgroup = WORKGROUP
	server string = dadiOS
	server role = standalone server
	security = user
	passdb backend = tdbsam
	map to guest = never
	server min protocol = SMB3_00
	disable netbios = yes
	smb ports = 445
	hosts allow = 127.0.0.1 ::1 100.64.0.0/10 fd7a:115c:a1e0::/48
	hosts deny = ALL
	load printers = no
	printing = bsd
	printcap name = /dev/null
	disable spoolss = yes
	vfs objects = catia fruit streams_xattr
	fruit:metadata = stream
	fruit:model = MacSamba
	fruit:posix_rename = yes
	fruit:nfs_aces = no
	fruit:wipe_intentionally_left_blank_rfork = yes
	fruit:delete_empty_adfiles = yes

[dadi]
	path = /var/home/dadi
	valid users = @wheel
	force user = dadi
	force group = dadi
	veto files = /.DS_Store/
	delete veto files = yes
	read only = no
