# dadiOS state root: root-owned; dadi may traverse to browsers/ but not list or write it.
d /var/lib/dadi 0711 root root -
# Runtime dir for the dadi user tmux socket (/run/dadi/tmux.sock).
d /run/dadi 0755 dadi dadi -
# Installer/bootc may drop /etc default.target; the appliance is headless, with only the tty1 console.
L+ /etc/systemd/system/default.target - - - - /usr/lib/systemd/system/multi-user.target
