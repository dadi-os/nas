name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: nas-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Quadlet images are fully qualified
        run: |
          set -euo pipefail
          bad="$(grep -R --include='*.container' -h '^Image=' os/etc/containers/systemd \
            | grep -vE '^Image=[a-z0-9.-]+\.[a-z0-9.-]+/' || true)"
          if [ -n "$bad" ]; then
            echo "Fedora Podman cannot resolve short names without a TTY:"
            echo "$bad"
            exit 1
          fi

      - name: SDDM autologins dadi on Wayland
        run: |
          set -euo pipefail
          grep -q 'sddm-wayland-plasma' os/Containerfile
          grep -q 'systemctl mask plasmalogin.service' os/Containerfile
          grep -q 'systemctl enable --force sddm.service' os/Containerfile
          grep -q '^User=dadi$' os/etc/sddm.conf.d/dadi.conf
          grep -q '^Session=plasma.desktop$' os/etc/sddm.conf.d/dadi.conf
          grep -q 'CompositorCommand=kwin_wayland' os/etc/sddm.conf.d/dadi.conf
          grep -q 'pam_permit.so' os/etc/pam.d/sddm-autologin
          grep -q 'Requires=dadi-home.service' os/etc/systemd/system/sddm.service.d/dadi.conf

      - name: Failed-unit causes are gated
        run: |
          set -euo pipefail
          grep -q '^Notify=healthy$' os/etc/containers/systemd/ghar-postgres.container
          grep -q '^Notify=healthy$' os/etc/containers/systemd/yaad-postgres.container
          grep -q '^Notify=healthy$' os/etc/containers/systemd/dimaag-postgres.container
          grep -q '^RunInit=true$' os/etc/containers/systemd/ghar-postgres.container
          grep -q '^RunInit=true$' os/etc/containers/systemd/yaad-postgres.container
          grep -q '^RunInit=true$' os/etc/containers/systemd/dimaag-postgres.container
          grep -q '^TimeoutStartSec=300$' os/etc/containers/systemd/ghar-postgres.container
          grep -q '^TimeoutStartSec=300$' os/etc/containers/systemd/yaad-postgres.container
          grep -q '^TimeoutStartSec=300$' os/etc/containers/systemd/dimaag-postgres.container
          grep -q '^TimeoutStopSec=180$' os/etc/containers/systemd/ghar-postgres.container
          grep -q '^TimeoutStopSec=180$' os/etc/containers/systemd/yaad-postgres.container
          grep -q '^TimeoutStopSec=180$' os/etc/containers/systemd/dimaag-postgres.container
          grep -q '^BindsTo=yaad-postgres.service$' os/etc/containers/systemd/yaad.container
          grep -q '^BindsTo=yaad-postgres.service$' os/etc/containers/systemd/yaad-migrate.container
          grep -q '^WantedBy=yaad-postgres.service$' os/etc/containers/systemd/yaad.container
          grep -q '^WantedBy=yaad-postgres.service$' os/etc/containers/systemd/yaad-migrate.container
          grep -q '^BindsTo=dimaag-postgres.service$' os/etc/containers/systemd/dimaag.container
          grep -q '^BindsTo=dimaag-postgres.service$' os/etc/containers/systemd/dimaag-migrate.container
          grep -q '^WantedBy=dimaag-postgres.service$' os/etc/containers/systemd/dimaag.container
          grep -q '^WantedBy=dimaag-postgres.service$' os/etc/containers/systemd/dimaag-migrate.container
          grep -q '^BindsTo=ghar-postgres.service$' os/etc/containers/systemd/ghar.container
          grep -q '^BindsTo=ghar-postgres.service$' os/etc/containers/systemd/ghar-migrate.container
          grep -q '^WantedBy=ghar-postgres.service$' os/etc/containers/systemd/ghar.container
          grep -q '^WantedBy=ghar-postgres.service$' os/etc/containers/systemd/ghar-migrate.container
          grep -q 'dadi-apply-desktop.service' os/Containerfile
          grep -q 'seq 1 120' os/usr/libexec/dadi/apply-desktop.sh
          grep -q 'busctl --user' os/usr/libexec/dadi/apply-desktop.sh
          grep -q 'org.kde.plasma.desktop-layout.js' os/usr/libexec/dadi/apply-desktop.sh
          grep -q 'systemctl mask tuned.service' os/Containerfile
          grep -q 'systemctl mask clevis-luks-askpass.service' os/Containerfile
          grep -q 'TimeoutStartSec=45' os/etc/systemd/system/dadi-tpm-enroll.service
          grep -q -- '--unlock-key-file=' os/usr/libexec/dadi/tpm-enroll.sh
          grep -q 'luks-enroll.key' os/usr/libexec/dadi/tpm-enroll.sh
          grep -q "printf '%s' '__LUKS_PASSPHRASE__'" os/installer/config.toml
          grep -q 'tpm-enroll.sh --keep-key' os/installer/config.toml
          grep -q 'L+ /etc/systemd/system/default.target' os/etc/tmpfiles.d/dadi.conf

      - name: Build test image
        run: docker build -f service/Dockerfile --target test -t nas-service-test service/

      - name: Test
        run: docker run --rm --shm-size=1g nas-service-test go test ./...

      - name: Vet
        run: docker run --rm nas-service-test go vet ./...
