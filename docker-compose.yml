name: dadi

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      dadi:
        # Containers resolve *.dadi here (port 80) the same way the Mac
        # resolves them via /etc/hosts → localhost:80. Without these aliases,
        # Docker DNS only knows bare service names (dwar, yaad, …).
        aliases:
          - dwar.dadi
          - yaad.dadi
          - dimaag.dadi
          - ghar.dadi
          - nas.dadi
          - hath.dadi
    depends_on:
      dwar:
        condition: service_healthy
      yaad:
        condition: service_healthy
      dimaag:
        condition: service_healthy
      ghar:
        condition: service_healthy
      nas-service:
        condition: service_healthy
      hath:
        condition: service_healthy

  dwar:
    build:
      context: ../dwar
      target: dev
    env_file: ../dwar/.env
    volumes:
      - ../dwar:/app
      - ../dwar/config.toml:/app/config.toml:ro
    expose: ["8080"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [dadi]

  yaad-postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: yaad
      POSTGRES_DB: yaad
      POSTGRES_PASSWORD: yaad
    volumes:
      - yaad_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaad -d yaad"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks: [dadi]

  yaad-migrate:
    build:
      context: ../yaad
      target: dev
    environment:
      DATABASE_URL: postgres://yaad:yaad@yaad-postgres:5432/yaad
    volumes:
      - ../yaad:/app
      - /app/node_modules
    command: ["npm", "run", "db:migrate"]
    depends_on:
      yaad-postgres:
        condition: service_healthy
    networks: [dadi]
    restart: "no"

  yaad:
    build:
      context: ../yaad
      target: dev
    environment:
      DATABASE_URL: postgres://yaad:yaad@yaad-postgres:5432/yaad
    volumes:
      - ../yaad:/app
      - /app/node_modules
    expose: ["8080"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      yaad-postgres:
        condition: service_healthy
      yaad-migrate:
        condition: service_completed_successfully
    networks: [dadi]

  dimaag-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: dimaag
      POSTGRES_DB: dimaag
      POSTGRES_PASSWORD: dimaag
    volumes:
      - dimaag_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dimaag -d dimaag"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks: [dadi]

  dimaag-migrate:
    build:
      context: ../dimaag
      target: dev
    environment:
      DATABASE_URL: postgres://dimaag:dimaag@dimaag-postgres:5432/dimaag
    volumes:
      - ../dimaag:/app
      - /app/node_modules
    command: ["npm", "run", "db:migrate"]
    depends_on:
      dimaag-postgres:
        condition: service_healthy
    networks: [dadi]
    restart: "no"

  dimaag:
    build:
      context: ../dimaag
      target: dev
    environment:
      DATABASE_URL: postgres://dimaag:dimaag@dimaag-postgres:5432/dimaag
    volumes:
      - ../dimaag:/app
      - /app/node_modules
    expose: ["8080"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      dimaag-postgres:
        condition: service_healthy
      dimaag-migrate:
        condition: service_completed_successfully
    networks: [dadi]

  ghar-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ghar
      POSTGRES_DB: ghar
      POSTGRES_PASSWORD: ghar
    volumes:
      - ghar_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghar -d ghar"]
      interval: 2s
      timeout: 5s
      retries: 20
    networks: [dadi]

  ghar-migrate:
    build:
      context: ../ghar
      target: dev
    environment:
      DATABASE_URL: postgres://ghar:ghar@ghar-postgres:5432/ghar
    volumes:
      - ../ghar:/app
      - /app/node_modules
    command: ["npm", "run", "db:migrate"]
    depends_on:
      ghar-postgres:
        condition: service_healthy
    networks: [dadi]
    restart: "no"

  ghar:
    build:
      context: ../ghar
      target: dev
    environment:
      DATABASE_URL: postgres://ghar:ghar@ghar-postgres:5432/ghar
      MATTER_STORAGE_PATH: /var/lib/ghar/matter
    volumes:
      - ../ghar:/app
      - /app/node_modules
      - ghar_matter:/var/lib/ghar/matter
    expose: ["8080"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      ghar-postgres:
        condition: service_healthy
      ghar-migrate:
        condition: service_completed_successfully
    networks: [dadi]

  # Control plane. Published on the host so a device that has not yet joined
  # the mesh can still reach it (it cannot resolve *.dadi yet). Same reason
  # control_url lives in the provisioning bundle.
  headscale:
    image: headscale/headscale:0.26
    command: serve
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale_data:/var/lib/headscale
      - headscale_run:/var/run/headscale
    ports:
      - "8080:8080"
    networks: [dadi]

  # Creates the Headscale user and sidecar auth key. Idempotent on every up.
  bootstrap:
    build:
      context: ./service
      target: production
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./bootstrap.sh:/bootstrap.sh:ro
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale_data:/var/lib/headscale
      - headscale_run:/var/run/headscale
      - bootstrap:/run/bootstrap
    depends_on: [headscale]
    networks: [dadi]
    restart: "no"

  # Mesh node that receives *.dadi traffic and L3-forwards it to Caddy.
  # Current Tailscale rejects TS_DEST_IP with userspace mode, so this uses
  # kernel networking (NET_ADMIN + TUN) — the L3 forward still matches the
  # intended sidecar shape.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: os
    environment:
      TS_AUTHKEY: file:/run/bootstrap/authkey
      TS_EXTRA_ARGS: --login-server=http://headscale:8080
      TS_USERSPACE: "false"
      TS_EXPERIMENTAL_DEST_DNS_NAME: caddy
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: os
    volumes:
      - tailscale_state:/var/lib/tailscale
      - bootstrap:/run/bootstrap:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      caddy:
        condition: service_started
    networks: [dadi]

  nas-service:
    build:
      context: ./service
      target: dev
    environment:
      CONTROL_URL: http://localhost:8080
      HEADSCALE_USER: ankur
      LISTEN_ADDR: ":8080"
      LOKI_URL: http://loki:3100
      DADI_STATE_DIR: /var/lib/dadi
      DADI_RUNTIME: compose
      DADI_COMPOSE_DIR: /nas
    volumes:
      - ./service:/src
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale_data:/var/lib/headscale
      - headscale_run:/var/run/headscale
      # Dwar secrets/config only — Yaad/Dimaag Postgres is baked into this compose file.
      - ../dwar/.env:/var/lib/dadi/modules/dwar/.env
      - ../dwar/config.toml:/var/lib/dadi/modules/dwar/config.toml
      - cloudflared_data:/var/lib/dadi/cloudflared
      - .:/nas:ro
      - /var/run/docker.sock:/var/run/docker.sock
    expose: ["8080"]
    # Host publish for curl provision / debugging before mesh DNS.
    ports:
      - "8092:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      loki:
        condition: service_started
    networks: [dadi]

  # Browser Hath (Vite). Prod Hath remains the Tauri app on other devices.
  hath:
    build:
      context: ../hath
      target: dev
    volumes:
      - ../hath:/app
      - /app/node_modules
    expose: ["8080"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 60
    networks: [dadi]

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./logging/loki-config.yaml:/etc/loki/config.yaml:ro
      - type: tmpfs
        target: /loki
    expose: ["3100"]
    networks: [dadi]

  alloy:
    image: grafana/alloy:v1.7.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./logging/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks: [dadi]

networks:
  dadi:

volumes:
  yaad_pg:
  dimaag_pg:
  ghar_pg:
  ghar_matter:
  headscale_data:
  headscale_run:
  tailscale_state:
  bootstrap:
  cloudflared_data:
  alloy_data:
